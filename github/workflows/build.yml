      distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6'

      - name: Build mod
        working-directory: CART3R-Client-GitHub-Build
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CART3R-Client-1.0.0
          path: CART3R-Client-GitHub-Build/build/libs/*.jar
