name: Build CART3R Client

on:
  workflow_dispatch:
  push:
    paths:
      - 'CART3R-Client-GitHub-Build/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

     - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build mod
        working-directory: CART3R-Client-GitHub-Build
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CART3R-Client-1.0.0
          path: CART3R-Client-GitHub-Build/build/libs/*.jar
